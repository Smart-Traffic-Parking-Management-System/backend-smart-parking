global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:3000']

  - job_name: 'oauth-server'
    static_configs:
      - targets: ['oauth-server:3002']

  - job_name: 'citizen-service'
    static_configs:
      - targets: ['citizen-service:8000']

  - job_name: 'traffic-service'
    static_configs:
      - targets: ['traffic-service:8001']

  - job_name: 'parking-service'
    static_configs:
      - targets: ['parking-service:8002']

  - job_name: 'python-ml'
    static_configs:
      - targets: ['python-ml:5000']

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15672']