apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: smartcity
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://prometheus.smartcity.svc.cluster.local:9090
      isDefault: true
      editable: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: smartcity
data:
  smartcity-dashboard.json: |
    {
      "dashboard": {
        "title": "Smart Traffic & Parking System",
        "panels": [
          {
            "title": "Request Rate (req/s) per Service",
            "targets": [
              {
                "expr": "rate(http_requests_total[5m])"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Error Rate (%) per Service",
            "targets": [
              {
                "expr": "rate(http_requests_total{status=~'5..'}[5m]) / rate(http_requests_total[5m]) * 100"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Response Latency P95 (ms)",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) * 1000"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Container CPU Usage (%)",
            "targets": [
              {
                "expr": "rate(container_cpu_usage_seconds_total[5m]) * 100"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Container Memory Usage (MB)",
            "targets": [
              {
                "expr": "container_memory_usage_bytes / 1024 / 1024"
              }
            ],
            "type": "graph"
          },
          {
            "title": "RabbitMQ Queue Depth",
            "targets": [
              {
                "expr": "rabbitmq_queue_messages"
              }
            ],
            "type": "graph"
          },
          {
            "title": "Database Connection Pool",
            "targets": [
              {
                "expr": "mysql_global_status_threads_connected"
              }
            ],
            "type": "gauge"
          },
          {
            "title": "ML Model Predictions (count/min)",
            "targets": [
              {
                "expr": "rate(ml_predictions_total[1m])"
              }
            ],
            "type": "stat"
          }
        ]
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: smartcity
  labels:
    app: grafana
    tier: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
      tier: monitoring
  template:
    metadata:
      labels:
        app: grafana
        tier: monitoring
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grafana-admin
              key: password
        - name: GF_USERS_ALLOW_SIGN_UP
          value: "false"
        - name: GF_SERVER_ROOT_URL
          value: "http://grafana.smartcity.svc.cluster.local:3000"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: grafana-datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: grafana-dashboards
          mountPath: /etc/grafana/provisioning/dashboards
        - name: grafana-storage
          mountPath: /var/lib/grafana
      volumes:
      - name: grafana-datasources
        configMap:
          name: grafana-datasources
      - name: grafana-dashboards
        configMap:
          name: grafana-dashboards
      - name: grafana-storage
        emptyDir: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: smartcity
type: Opaque
stringData:
  password: admin_password_change_me
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: smartcity
  labels:
    app: grafana
spec:
  type: NodePort
  selector:
    app: grafana
    tier: monitoring
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30300
    protocol: TCP
    name: http
