apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth-server
  namespace: smartcity
  labels:
    app: oauth-server
    tier: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth-server
      tier: gateway
  template:
    metadata:
      labels:
        app: oauth-server
        tier: gateway
    spec:
      containers:
      - name: oauth-server
        image: oauth-server:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3002
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: smartcity-config
              key: OAUTH_PORT
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: smartcity-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: smartcity-config
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: smartcity-config
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: smartcity-config
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: smartcity-secrets
              key: DB_PASSWORD
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: smartcity-secrets
              key: JWT_SECRET
        - name: JWT_EXPIRES_IN
          valueFrom:
            configMapKeyRef:
              name: smartcity-config
              key: JWT_EXPIRES_IN
        - name: OAUTH_CLIENT_ID
          valueFrom:
            configMapKeyRef:
              name: smartcity-config
              key: OAUTH_CLIENT_ID
        - name: OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: smartcity-secrets
              key: OAUTH_CLIENT_SECRET
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: oauth-server
  namespace: smartcity
  labels:
    app: oauth-server
spec:
  type: ClusterIP
  selector:
    app: oauth-server
    tier: gateway
  ports:
  - port: 3002
    targetPort: 3002
    protocol: TCP
    name: http
