apiVersion: apps/v1
kind: Deployment
metadata:
  name: citizen-service
  namespace: smartcity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: citizen-service
  template:
    metadata:
      labels:
        app: citizen-service
    spec:
      containers:
      - name: citizen-service
        image: smartcity/citizen-service:latest
        envFrom:
        - configMapRef:
            name: smartcity-config
        - secretRef:
            name: smartcity-secrets
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: citizen-service
  namespace: smartcity
spec:
  selector:
    app: citizen-service
  ports:
  - port: 8000
    targetPort: 8000
---
