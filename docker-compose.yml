networks:
  smartcity-net:
    driver: bridge

volumes:
  mysql-data:
  rabbitmq-data:

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - smartcity-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - smartcity-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./iot/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./iot/passwd:/mosquitto/config/passwd
    networks:
      - smartcity-net

  nodered:
    image: nodered/node-red:3.1
    container_name: nodered
    ports:
      - "1880:1880"
    volumes:
      - ./iot/node-red-data:/data
    networks:
      - smartcity-net

  traffic-service:
    build:
      context: ./php-traffic
      dockerfile: Dockerfile
    container_name: traffic-service
    ports:
      - "8001:8001"
    volumes:
      - ./php-traffic:/app
    networks:
      - smartcity-net
    depends_on:
      - mysql

  iot-simulator:
    image: python:3.10-slim
    container_name: iot-simulator
    volumes:
      - ./iot:/app
    working_dir: /app
    command: sh -c "pip install paho-mqtt && python3 -u simulator.py"
    network_mode: "service:mosquitto"
    depends_on:
      - mosquitto
    restart: always
