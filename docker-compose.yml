version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: smartcity-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
    networks:
      - smartcity-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  oauth-server:
    build: ./oauth-server
    container_name: oauth-server
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-86400}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
      USER_USERNAME: ${USER_USERNAME:-admin}
      USER_PASSWORD: ${USER_PASSWORD:-admin123}
      INTROSPECTION_API_KEY: ${OAUTH_INTROSPECTION_API_KEY}
    networks:
      - smartcity-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  api-gateway:
    build: ./express-gateway
    container_name: api-gateway
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      OAUTH_SERVER_URL: http://oauth-server:3002
      OAUTH_INTROSPECT_PATH: /oauth/introspect
      OAUTH_INTROSPECTION_API_KEY: ${OAUTH_INTROSPECTION_API_KEY}
      CITIZEN_SERVICE_URL: ${CITIZEN_SERVICE_URL}
      TRAFFIC_SERVICE_URL: ${TRAFFIC_SERVICE_URL}
      PARKING_SERVICE_URL: ${PARKING_SERVICE_URL}
      PYTHON_ML_URL: ${PYTHON_ML_URL}
    networks:
      - smartcity-net
    depends_on:
      - oauth-server

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: smartcity-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - smartcity-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  rabbitmq-init:
    image: curlimages/curl:latest
    container_name: rabbitmq-init
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - smartcity-net
    restart: "no"
    entrypoint: >
      sh -c "
        curl -s -u ${RABBITMQ_USER}:${RABBITMQ_PASS} -X PUT http://rabbitmq:15672/api/exchanges/%2F/city.events -H 'Content-Type: application/json' -d '{\"type\":\"topic\",\"durable\":true}' &&
        curl -s -u ${RABBITMQ_USER}:${RABBITMQ_PASS} -X PUT http://rabbitmq:15672/api/queues/%2F/traffic.new -H 'Content-Type: application/json' -d '{\"durable\":true}' &&
        curl -s -u ${RABBITMQ_USER}:${RABBITMQ_PASS} -X PUT http://rabbitmq:15672/api/queues/%2F/parking.update -H 'Content-Type: application/json' -d '{\"durable\":true}' &&
        curl -s -u ${RABBITMQ_USER}:${RABBITMQ_PASS} -X PUT http://rabbitmq:15672/api/queues/%2F/anomaly.alert -H 'Content-Type: application/json' -d '{\"durable\":true}' &&
        curl -s -u ${RABBITMQ_USER}:${RABBITMQ_PASS} -X PUT http://rabbitmq:15672/api/queues/%2F/report.submitted -H 'Content-Type: application/json' -d '{\"durable\":true}' &&
        curl -s -u ${RABBITMQ_USER}:${RABBITMQ_PASS} -X POST http://rabbitmq:15672/api/bindings/%2F/e/city.events/q/traffic.new -H 'Content-Type: application/json' -d '{\"routing_key\":\"traffic.new\"}' &&
        curl -s -u ${RABBITMQ_USER}:${RABBITMQ_PASS} -X POST http://rabbitmq:15672/api/bindings/%2F/e/city.events/q/parking.update -H 'Content-Type: application/json' -d '{\"routing_key\":\"parking.update\"}' &&
        curl -s -u ${RABBITMQ_USER}:${RABBITMQ_PASS} -X POST http://rabbitmq:15672/api/bindings/%2F/e/city.events/q/anomaly.alert -H 'Content-Type: application/json' -d '{\"routing_key\":\"anomaly.alert\"}' &&
        curl -s -u ${RABBITMQ_USER}:${RABBITMQ_PASS} -X POST http://rabbitmq:15672/api/bindings/%2F/e/city.events/q/report.submitted -H 'Content-Type: application/json' -d '{\"routing_key\":\"report.submitted\"}' &&
        echo 'RabbitMQ setup complete!'
      "

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./iot/mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - smartcity-net

  nodered:
    image: nodered/node-red:3.1
    container_name: nodered
    ports:
      - "1880:1880"
    volumes:
      - ./iot/node-red-data:/data
    networks:
      - smartcity-net

  traffic-service:
    build:
      context: ./php-traffic
      dockerfile: Dockerfile
    container_name: traffic-service
    ports:
      - "8001:8001"
    volumes:
      - ./php-traffic:/app
    environment:
      DB_HOST: mysql
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
    networks:
      - smartcity-net
    depends_on:
      - mysql

  iot-simulator:
    image: python:3.10-slim
    container_name: iot-simulator
    volumes:
      - ./iot:/app
    working_dir: /app
    command: sh -c "pip install paho-mqtt && python3 -u simulator.py"
    network_mode: "service:mosquitto"
    depends_on:
      - mosquitto
    restart: always

  python-ml-service:
    build: ./python-ml-service
    container_name: python-ml-service
    ports:
      - "5000:5000"
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - smartcity-net

  citizen-service:
    build: ./php-citizen
    container_name: citizen-service
    ports:
      - "8000:8000"
    environment:
      DB_HOST: mysql
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
    networks:
      - smartcity-net
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  parking-service:
    build: ./php-parking
    container_name: parking-service
    ports:
      - "8002:8002"
    environment:
      DB_HOST: mysql
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
    networks:
      - smartcity-net
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mysql_data:
  rabbitmq_data:

networks:
  smartcity-net:
    driver: bridge
