apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: smartcity
data:
  rabbitmq.conf: |
    default_user = smartcity
    default_pass = smartcity_rabbitmq_password
    listeners.tcp.default = 5672
    management.listener.port = 15672
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: smartcity
  labels:
    app: rabbitmq
    tier: messaging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
      tier: messaging
  template:
    metadata:
      labels:
        app: rabbitmq
        tier: messaging
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3.12-management-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5672
          name: amqp
        - containerPort: 15672
          name: management
        env:
        - name: RABBITMQ_DEFAULT_USER
          valueFrom:
            configMapKeyRef:
              name: smartcity-config
              key: RABBITMQ_USER
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              name: smartcity-secrets
              key: RABBITMQ_PASSWORD
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - rabbitmq-diagnostics -q ping
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - rabbitmq-diagnostics -q check_running
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: rabbitmq-data
          mountPath: /var/lib/rabbitmq
        - name: rabbitmq-config
          mountPath: /etc/rabbitmq
      volumes:
      - name: rabbitmq-data
        emptyDir: {}
      - name: rabbitmq-config
        configMap:
          name: rabbitmq-config
          defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: smartcity
  labels:
    app: rabbitmq
spec:
  type: ClusterIP
  selector:
    app: rabbitmq
    tier: messaging
  ports:
  - port: 5672
    targetPort: 5672
    protocol: TCP
    name: amqp
  - port: 15672
    targetPort: 15672
    protocol: TCP
    name: management
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-management
  namespace: smartcity
  labels:
    app: rabbitmq
spec:
  type: NodePort
  selector:
    app: rabbitmq
    tier: messaging
  ports:
  - port: 15672
    targetPort: 15672
    nodePort: 30672
    protocol: TCP
    name: management