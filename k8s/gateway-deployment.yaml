apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth-server
  namespace: smartcity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth-server
  template:
    metadata:
      labels:
        app: oauth-server
    spec:
      containers:
      - name: oauth-server
        image: smartcity/oauth-server:latest
        envFrom:
        - configMapRef:
            name: smartcity-config
        - secretRef:
            name: smartcity-secrets
        ports:
        - containerPort: 3002
---
apiVersion: v1
kind: Service
metadata:
  name: oauth-server
  namespace: smartcity
spec:
  selector:
    app: oauth-server
  ports:
  - port: 3002
    targetPort: 3002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: smartcity
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: smartcity/api-gateway:latest
        envFrom:
        - configMapRef:
            name: smartcity-config
        - secretRef:
            name: smartcity-secrets
        ports:
        - containerPort: 3000
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-svc
  namespace: smartcity
spec:
  selector:
    app: api-gateway
  ports:
  - port: 80
    targetPort: 3000
  type: ClusterIP