apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smartcity-ingress
  namespace: smartcity
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway-svc
            port:
              number: 80
      - path: /oauth
        pathType: Prefix
        backend:
          service:
            name: oauth-server
            port:
              number: 3002
      - path: /api/citizens
        pathType: Prefix
        backend:
          service:
            name: citizen-service
            port:
              number: 8000
      - path: /api/traffic
        pathType: Prefix
        backend:
          service:
            name: traffic-service
            port:
              number: 8001
      - path: /api/parking
        pathType: Prefix
        backend:
          service:
            name: parking-service
            port:
              number: 8002
      - path: /predict
        pathType: Prefix
        backend:
          service:
            name: python-ml
            port:
              number: 5000