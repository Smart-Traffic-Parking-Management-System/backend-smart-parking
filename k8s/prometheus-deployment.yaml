apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: smartcity
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'smartcity'
        environment: 'production'

    alerting:
      alertmanagers:
      - static_configs:
        - targets: []

    rule_files:
      - '/etc/prometheus/rules/*.yml'

    scrape_configs:
    - job_name: 'prometheus'
      static_configs:
      - targets: ['localhost:9090']

    - job_name: 'api-gateway'
      static_configs:
      - targets: ['api-gateway.smartcity.svc.cluster.local:3000']
      metrics_path: '/metrics'
      scrape_interval: 10s

    - job_name: 'oauth-server'
      static_configs:
      - targets: ['oauth-server.smartcity.svc.cluster.local:3002']
      metrics_path: '/metrics'

    - job_name: 'citizen-service'
      static_configs:
      - targets: ['citizen-service.smartcity.svc.cluster.local:8000']
      metrics_path: '/metrics'

    - job_name: 'traffic-service'
      static_configs:
      - targets: ['traffic-service.smartcity.svc.cluster.local:8001']
      metrics_path: '/metrics'

    - job_name: 'parking-service'
      static_configs:
      - targets: ['parking-service.smartcity.svc.cluster.local:8002']
      metrics_path: '/metrics'

    - job_name: 'python-ml-service'
      static_configs:
      - targets: ['python-ml-service.smartcity.svc.cluster.local:5000']
      metrics_path: '/metrics'
      scrape_interval: 10s

    - job_name: 'rabbitmq'
      static_configs:
      - targets: ['rabbitmq.smartcity.svc.cluster.local:15692']

    - job_name: 'mysql'
      static_configs:
      - targets: ['mysql.smartcity.svc.cluster.local:3306']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: smartcity
  labels:
    app: prometheus
    tier: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
      tier: monitoring
  template:
    metadata:
      labels:
        app: prometheus
        tier: monitoring
    spec:
      serviceAccountName: prometheus
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        imagePullPolicy: IfNotPresent
        args:
          - '--config.file=/etc/prometheus/prometheus.yml'
          - '--storage.tsdb.path=/prometheus/'
          - '--storage.tsdb.retention.time=30d'
          - '--web.enable-lifecycle'
        ports:
        - containerPort: 9090
          name: http
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: 9090
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9090
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus
        - name: prometheus-storage
          mountPath: /prometheus
      volumes:
      - name: prometheus-config
        configMap:
          name: prometheus-config
      - name: prometheus-storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: smartcity
  labels:
    app: prometheus
spec:
  type: ClusterIP
  selector:
    app: prometheus
    tier: monitoring
  ports:
  - port: 9090
    targetPort: 9090
    protocol: TCP
    name: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: smartcity
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
- apiGroups: [""]
  resources:
  - nodes
  - nodes/proxy
  - services
  - endpoints
  - pods
  verbs: ["get", "list", "watch"]
- apiGroups:
  - extensions
  resources:
  - ingresses
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: smartcity
