apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-ml-service
  namespace: smartcity
  labels:
    app: python-ml-service
    tier: ml
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-ml-service
      tier: ml
  template:
    metadata:
      labels:
        app: python-ml-service
        tier: ml
    spec:
      containers:
      - name: python-ml
        image: python-ml-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: smartcity-config
              key: ML_PORT
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: smartcity-config
              key: ML_LOG_LEVEL
        - name: RABBITMQ_HOST
          valueFrom:
            configMapKeyRef:
              name: smartcity-config
              key: RABBITMQ_HOST
        - name: RABBITMQ_PORT
          valueFrom:
            configMapKeyRef:
              name: smartcity-config
              key: RABBITMQ_PORT
        - name: RABBITMQ_USER
          valueFrom:
            configMapKeyRef:
              name: smartcity-config
              key: RABBITMQ_USER
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: smartcity-secrets
              key: RABBITMQ_PASSWORD
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: smartcity-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: smartcity-config
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: smartcity-config
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: smartcity-config
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: smartcity-secrets
              key: DB_PASSWORD
        - name: MODEL_PATH
          valueFrom:
            configMapKeyRef:
              name: smartcity-config
              key: ML_MODEL_PATH
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: model-storage
          mountPath: /app/models
      volumes:
      - name: model-storage
        emptyDir: {}
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: python-ml-service
  namespace: smartcity
  labels:
    app: python-ml-service
spec:
  type: ClusterIP
  selector:
    app: python-ml-service
    tier: ml
  ports:
  - port: 5000
    targetPort: 5000
    protocol: TCP
    name: http